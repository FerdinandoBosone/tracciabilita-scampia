<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tracciabilità Cantiere Scampia</title>
<meta name="description" content="Avanzamento dei lavori e tracciabilità dei rifiuti del cantiere di Scampia: cumuli, analisi, FIR e conferimenti agli impianti.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: barra di cantiere in alto con menu, contenuto a colonna unica con griglie che si ripiegano su telefono */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface2:#e9eef4; --line:#d3dbe4;
  --fg:#15212e; --mute:#5a6878; --brand:#00589f; --brand-ink:#ffffff; --brand-soft:#dbe9f6;
  --s1:#8a6a50; --s2:#c77d12; --s3:#6a4c93; --s4:#1f6fd1; --s5:#1d8a63;
  --rec:#1d8a63; --disp:#7b8794; --warn:#b4540a; --warn-soft:#fff1dc; --danger:#c0392b;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#16202b; --surface2:#1e2a37; --line:#2c3b4b;
  --fg:#e6edf4; --mute:#93a3b4; --brand:#3d8fd6; --brand-ink:#ffffff; --brand-soft:#16324d;
  --s1:#b48f72; --s2:#e3a03c; --s3:#a585d3; --s4:#5aa2f0; --s5:#3fbf8f;
  --rec:#3fbf8f; --disp:#93a3b4; --warn:#f0a050; --warn-soft:#3a2a12; --danger:#ef6f60; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#16202b; --surface2:#1e2a37; --line:#2c3b4b;
  --fg:#e6edf4; --mute:#93a3b4; --brand:#3d8fd6; --brand-ink:#ffffff; --brand-soft:#16324d;
  --s1:#b48f72; --s2:#e3a03c; --s3:#a585d3; --s4:#5aa2f0; --s5:#3fbf8f;
  --rec:#3fbf8f; --disp:#93a3b4; --warn:#f0a050; --warn-soft:#3a2a12; --danger:#ef6f60; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--brand-ink)}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px}
.brandmark{display:flex;align-items:baseline;gap:10px;min-width:0}
.brandmark b{font-family:var(--f-display);font-size:24px;letter-spacing:.02em;font-weight:700;white-space:nowrap}
.brandmark span{font-size:13px;opacity:.85}
nav.menu{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.rti{display:flex;align-items:stretch;background:#ffffff;border-radius:8px;padding:5px 4px;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.rti figure{margin:0;display:grid;justify-items:center;align-content:center;gap:2px;padding:0 10px}
.rti figure+figure{border-left:1px solid #d3dbe4}
.rti img{height:30px;width:auto;display:block}
.rti figcaption{font:700 8.5px var(--f-body);letter-spacing:.12em;color:#5a6878}
.rti figure.m figcaption{color:#00589f}
@media (max-width:620px){header.top{position:static}.rti{order:3;width:100%;justify-content:center}.rti img{height:24px}.rti figure{padding:0 7px}}
nav.menu button{font:600 14px var(--f-body);color:var(--brand-ink);background:transparent;border:1px solid transparent;border-radius:999px;padding:6px 14px;cursor:pointer}
nav.menu button:hover{border-color:rgba(255,255,255,.45)}
nav.menu button[aria-current="page"]{background:var(--brand-ink);color:#00589f}
nav.menu button:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--s2);outline-offset:2px}
.demo{background:var(--warn-soft);color:var(--warn);font-size:13.5px}
.demo .wrap{padding-block:7px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
main{padding-block:22px 48px;display:grid;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px);line-height:1.02}
h2{font-size:24px}
h3{font-size:19px}
.eyebrow{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.lead{max-width:68ch;color:var(--fg);font-size:16.5px}
.muted{color:var(--mute)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px}
.card.grid{align-content:start}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.g2>*,.g4>*{min-width:0}
.kpi .v{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:20px;font-weight:600;margin-left:3px}
.kpi .l{color:var(--mute);font-size:13.5px;margin-top:4px}
.bar{height:10px;border-radius:5px;background:var(--surface2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.hero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14.5px}
.facts dt{color:var(--mute)}
.facts dd{margin:0;font-weight:600}
.code{font-family:var(--f-mono);font-weight:700;letter-spacing:.02em}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid currentColor;white-space:nowrap}
.chip.dot::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st1{color:var(--s1);--c:var(--s1)}.st2{color:var(--s2);--c:var(--s2)}.st3{color:var(--s3);--c:var(--s3)}.st4{color:var(--s4);--c:var(--s4)}.st5{color:var(--s5);--c:var(--s5)}
.haz{color:var(--danger)}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--surface2);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{font-size:16.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:2px 4px 4px;border-bottom:3px solid currentColor}
.col h3 .n{font-family:var(--f-mono);font-size:13px}
.lot{all:unset;box-sizing:border-box;display:grid;gap:3px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;cursor:pointer}
.lot:hover{border-color:var(--brand)}
.lot:focus-visible{outline:3px solid var(--s2)}
.lot .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.lot .t{font-family:var(--f-mono);font-size:13px;color:var(--fg)}
.empty{color:var(--mute);font-size:13px;padding:8px 4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
label.f{display:grid;gap:4px;font-size:13px;color:var(--mute);font-weight:600}
input,select{font:15px var(--f-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;min-width:0}
.btn{font:700 14.5px var(--f-body);border-radius:8px;padding:9px 16px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.warn{background:var(--danger);border-color:var(--danger)}
.btn[disabled]{opacity:.55;cursor:progress}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:0;counter-reset:s}
.steps li{list-style:none;position:relative;padding:28px 6px 0;text-align:center;font-size:13px}
.steps li::before{content:"";position:absolute;top:10px;left:0;right:0;height:4px;background:var(--surface2)}
.steps li.done::before{background:var(--c)}
.steps li span.dotn{position:absolute;top:0;left:50%;transform:translateX(-50%);width:24px;height:24px;border-radius:50%;background:var(--surface);border:3px solid var(--line);display:grid;place-items:center;font:700 12px var(--f-mono);color:var(--mute)}
.steps li.done span.dotn{background:var(--c);border-color:var(--c)}
.steps li.done span.dotn b{color:var(--surface)}
.steps li .nm{display:block;font-weight:700;color:var(--fg)}
.steps li .dt{display:block;color:var(--mute);font-family:var(--f-mono);font-size:12px}
@media (max-width:620px){.steps{grid-template-columns:1fr}.steps li{text-align:left;padding:4px 0 10px 36px}.steps li::before{top:0;bottom:0;left:10px;right:auto;width:4px;height:auto}.steps li span.dotn{left:12px;top:2px}}
.detail{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
@media (max-width:820px){.detail{grid-template-columns:1fr}}
.qrbox{display:grid;gap:10px;justify-items:center;text-align:center}
.qrbox .qr{background:#fff;padding:10px;border-radius:8px;line-height:0}
.qrbox .qr img,.qrbox .qr canvas{width:180px;height:180px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:14.5px}
.kv dt{color:var(--mute)}.kv dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:700 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute);text-align:left;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
td.num,th.num{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
.feed{display:grid;gap:0;margin:0;padding:0}
.feed li{list-style:none;display:grid;grid-template-columns:92px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}
.feed time{font-family:var(--f-mono);font-size:12.5px;color:var(--mute)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.notice{border-left:4px solid var(--brand);background:var(--brand-soft);padding:10px 14px;border-radius:6px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.areabars{display:grid;gap:12px}
.areabars .r{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;font-size:14px}
.areabars .r .num{font-family:var(--f-mono);font-size:13px;text-align:right}
@media (max-width:520px){.areabars .r{grid-template-columns:90px 1fr 70px}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mute)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
footer{color:var(--mute);font-size:13px;padding-block:0 30px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

function fmtT(x){return (Math.round(x*10)/10).toLocaleString("it-IT",{minimumFractionDigits:0,maximumFractionDigits:1});}
function fmtD(d){if(!d)return "–";var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0];}
function today(){var t=new Date();return t.getFullYear()+"-"+String(t.getMonth()+1).padStart(2,"0")+"-"+String(t.getDate()).padStart(2,"0");}
function stato(l){return l.ev.length?l.ev[l.ev.length-1].s:1;}
function evDate(l,s){for(var i=0;i<l.ev.length;i++)if(l.ev[i].s===s)return l.ev[i].d;return "";}

function daysBetween(a,b){return Math.max(0,Math.round((new Date(b)-new Date(a))/86400000));}
function lotByCode(c){for(var i=0;i<state.lotti.length;i++)if(state.lotti[i].code===c)return state.lotti[i];return null;}
function chipSt(s){return '<span class="chip dot '+STATI[s].cls+'">'+esc(STATI[s].short)+'</span>';}
function isHaz(l){return (l.ca&&l.ca.haz)||l.fr==="AM";}
function qrText(code){return location.origin+"/#"+code;}

/* ---------- metriche ---------- */
function metrics(){
  var m={conf:0,rec:0,disp:0,viaggio:0,giac:0,byS:[0,0,0,0,0,0],area:{1:{c:0,g:0},2:{c:0,g:0},3:{c:0,g:0},4:{c:0,g:0}},fir:0,firOpen:0};
  state.lotti.forEach(function(l){var s=stato(l);m.byS[s]++;
    if(s===5){var t=l.sc.pd;m.conf+=t;m.area[l.area].c+=t;if(l.ca&&/^R/.test(l.ca.op))m.rec+=t;else m.disp+=t;}
    else if(s===4){m.viaggio+=l.tr.pp;m.area[l.area].g+=l.tr.pp;}
    else {m.giac+=l.stima||0;m.area[l.area].g+=l.stima||0;}
    if(s>=4){m.fir++;if(s===4||!(l.sc&&l.sc.q4))m.firOpen++;}
  });
  return m;
}

/* ---------- viste ---------- */

  var feed=[];state.lotti.forEach(function(l){l.ev.forEach(function(e){feed.push({d:e.d,s:e.s,l:l});});});
  feed.sort(function(a,b){return a.d<b.d?1:a.d>b.d?-1:b.s-a.s;});
  var maxA=1;[1,2,3,4].forEach(function(a){maxA=Math.max(maxA,m.area[a].c+m.area[a].g);});

   '<div class="grid" style="gap:12px"><div class="eyebrow">Lavori in corso · Napoli, Scampia</div>'+

   '<div class="card"><dl class="facts">'+
   '<dt>Committente</dt><dd>10° Reparto Infrastrutture – Napoli</dd>'+

   '<dt>Rifiuti stimati</dt><dd>circa 40.000 t</dd>'+
   '<dt>Durata</dt><dd>180 giorni</dd>'+
   '<dt>Campo base</dt><dd>nella rotonda (Area 2), sotto il viadotto</dd>'+
   '<dt>Squadre</dt><dd>almeno 2 in contemporanea</dd>'+
   '<dt>Ultimo aggiornamento</dt><dd>'+(state.aggiornato?esc(fmtD(state.aggiornato.slice(0,10)))+' · '+esc(state.aggiornato.slice(11,16)):'–')+'</dd>'+
   '</dl></div></section>'+
   '<section class="grid g4">'+
    kpi(fmtT(m.conf),"t","conferite agli impianti",'<div class="bar" style="margin-top:10px" aria-label="avanzamento sul totale"><i style="width:'+Math.min(100,pct).toFixed(2)+'%;background:var(--s5)"></i></div><div class="l">'+pct.toLocaleString("it-IT",{maximumFractionDigits:2})+'% delle 40.000 t stimate</div>')+
    kpi(recp.toLocaleString("it-IT",{maximumFractionDigits:0}),"%","del conferito avviato a recupero",'<div class="bar" style="margin-top:10px"><i style="width:'+recp.toFixed(1)+'%;background:var(--rec)"></i><i style="width:'+(m.conf?100-recp:0).toFixed(1)+'%;background:var(--disp)"></i></div><div class="l">'+fmtT(m.rec)+' t recupero · '+fmtT(m.disp)+' t smaltimento</div>')+
    kpi(fmtT(m.giac),"t","in giacenza nei cumuli",'<div class="l">'+(m.byS[1]+m.byS[2]+m.byS[3])+' lotti in attesa di carico</div>')+
    kpi(String(m.byS[4]),"","lotti in viaggio",'<div class="l">'+fmtT(m.viaggio)+' t con FIR aperto</div>')+
   '</section>'+
   '<section class="grid g2">'+
    '<div class="card grid" style="gap:14px"><h2>Cumuli per stato</h2>'+
     '<div class="grid" style="gap:8px">'+[1,2,3,4,5].map(function(s){var n=m.byS[s],tot=state.lotti.length||1;return '<div style="display:grid;grid-template-columns:minmax(150px,210px) 1fr 34px;gap:10px;align-items:center;font-size:14px"><span class="'+STATI[s].cls+'" style="font-weight:700">'+esc(STATI[s].n)+'</span><div class="bar"><i style="width:'+(n/tot*100).toFixed(1)+'%;background:currentColor" class="'+STATI[s].cls+'"></i></div><span class="code" style="text-align:right">'+n+'</span></div>';}).join("")+'</div>'+
    '</div>'+
    '<div class="card grid" style="gap:14px"><h2>Avanzamento per area</h2>'+
     '<div class="legend"><span><i style="background:var(--s5)"></i>conferito</span><span><i style="background:var(--s2)"></i>in giacenza o in viaggio</span></div>'+
     '<div class="areabars">'+[2,1,3,4].map(function(a){var c=m.area[a].c,g=m.area[a].g;return '<div class="r"><span>'+esc(AREE[a])+'</span><div class="bar"><i style="width:'+(c/maxA*100).toFixed(1)+'%;background:var(--s5)"></i><i style="width:'+(g/maxA*100).toFixed(1)+'%;background:var(--s2)"></i></div><span class="num">'+fmtT(c+g)+' t</span></div>';}).join("")+'</div>'+
     '<p class="muted" style="margin:0;font-size:13px">La rotonda è la prima area bonificata: dopo la pulizia ospita il campo base.</p>'+
    '</div></section>'+
   '<section class="grid g2">'+
    '<div class="card"><h2 style="margin-bottom:8px">Ultimi movimenti</h2><ul class="feed">'+feed.slice(0,8).map(function(f){return '<li><time>'+esc(fmtD(f.d))+'</time><span><button class="code linkbtn" data-lot="'+esc(f.l.code)+'" style="all:unset;cursor:pointer;color:var(--brand);font-family:var(--f-mono);font-weight:700">'+esc(f.l.code)+'</button> · '+esc(STATI[f.s].n)+'</span></li>';}).join("")+'</ul></div>'+
    '<div class="card grid" style="gap:10px"><h2>Presidi ambientali attivi</h2><p class="muted" style="margin:0">In ogni area di intervento:</p><ul style="margin:0;padding-left:18px">'+
     '<li>centralina meteo e centralina PM10 e PM2,5 in continuo</li><li>cannoni nebulizzatori con bagnatura comandata dai dati di vento e PM10</li><li>recinzione con teli antipolvere, cancello e videosorveglianza</li><li>monitoraggio delle fibre durante la rimozione dell\'amianto</li></ul>'+
     '<p class="muted" style="margin:0;font-size:13px">Codici EER secondo l\'elenco europeo dei rifiuti (ex codici CER).</p></div>'+
   '</section>';
}
function kpi(v,u,l,extra){return '<div class="card kpi"><div class="v">'+esc(v)+(u?'<small>'+esc(u)+'</small>':'')+'</div><div class="l">'+esc(l)+'</div>'+(extra||"")+'</div>';}

function vCumuli(){
  var list=state.lotti.filter(function(l){
    if(filt.area&&String(l.area)!==filt.area)return false;
    if(filt.q&&l.code.indexOf(filt.q.toUpperCase().trim())<0&&FR[l.fr].n.toLowerCase().indexOf(filt.q.toLowerCase().trim())<0)return false;return true;});
  var cols=[1,2,3,4,5].map(function(s){var items=list.filter(function(l){return stato(l)===s;}).sort(function(a,b){return a.code<b.code?-1:1;});
    var tot=items.reduce(function(a,l){return a+tLot(l);},0);
    return '<div class="col"><h3 class="'+STATI[s].cls+'"><span>'+esc(STATI[s].n)+'</span><span class="n">'+items.length+'</span></h3>'+
      '<div class="muted" style="font-size:12.5px;padding:0 4px">'+fmtT(tot)+' t</div>'+
      (items.length?items.map(cardLot).join(""):'<div class="empty">Nessun lotto in questo stato.</div>')+'</div>';}).join("");
  return '<section class="grid" style="gap:10px"><div class="eyebrow">Gestione dei cumuli</div><h1>Cumuli in giacenza e flussi</h1>'+
    '<p class="lead" style="margin:0">Ogni colonna è uno stato del lotto. Apri un lotto per vedere date, analisi e FIR'+(canEdit?' e per registrare il passaggio successivo.':'.')+'</p></section>'+
    '<section class="filters"><label class="f" for="fArea">Area<select id="fArea" data-filt="area"><option value="">Tutte</option>'+[1,2,3,4].map(function(a){return '<option value="'+a+'"'+(filt.area===String(a)?' selected':'')+'>'+esc(AREE[a])+'</option>';}).join("")+'</select></label>'+
    '<label class="f" for="fQ">Cerca codice o frazione<input id="fQ" data-filt="q" value="'+esc(filt.q)+'" placeholder="es. A1-C03 o legno"></label>'+
    (canEdit?'<button class="btn" data-go="nuovo" style="margin-left:auto">Nuovo cumulo</button>':'')+'</section>'+
    '<section class="board">'+cols+'</section>';
}
function cardLot(l){var s=stato(l);var d=evDate(l,1);var end=evDate(l,5)||refDay();
  return '<button class="lot" data-lot="'+esc(l.code)+'"><span class="code" style="font-size:14px">'+esc(l.code)+'</span>'+
   '<span class="row"><span>'+esc(FR[l.fr].n)+(isHaz(l)?' · <b class="haz">pericoloso</b>':'')+'</span><span class="t">'+fmtT(tLot(l))+' t</span></span>'+
   '<span class="row"><span>'+esc(AREE[l.area])+'</span><span>'+(s<5?daysBetween(d,end)+' gg in giacenza':'chiuso')+'</span></span></button>';}

function vLot(code){
  var l=lotByCode(code); if(!l) return '<section class="card"><h2>Lotto non trovato</h2><p>Il codice <span class="code">'+esc(code)+'</span> non è registrato. Controlla l\'etichetta o cercalo tra i cumuli.</p><button class="btn" data-go="cumuli">Vai ai cumuli</button></section>';
  var s=stato(l), f=FR[l.fr];
  var steps='<ol class="steps" style="margin:0;padding:0">'+[1,2,3,4,5].map(function(k){var d=evDate(l,k);return '<li class="'+STATI[k].cls+(d?' done':'')+'"><span class="dotn"><b>'+k+'</b></span><span class="nm">'+esc(STATI[k].n)+'</span><span class="dt">'+(d?esc(fmtD(d)):'–')+'</span></li>';}).join("")+'</ol>';
  var kv=[["Area d'origine",AREE[l.area]],["Cumulo",String(l.cumulo).padStart(2,"0")],["Frazione",f.n+" ("+l.fr+")"],["Formato il",fmtD(evDate(l,1))],["Quantità stimata",fmtT(l.stima)+" t"]];
  if(l.pr) kv.push(["Verbale di prelievo",l.pr.verbale]);
  if(l.ca){kv.push(["Codice EER",l.ca.eer+(l.ca.haz?" · pericoloso":"")]);kv.push(["Rapporto di prova",l.ca.rdp+" · "+l.ca.lab+(placeOf(LABS,l.ca.lab)?" ("+placeOf(LABS,l.ca.lab)+")":"")]);kv.push(["Impianto di riferimento",l.ca.imp+(placeOf(IMPIANTI,l.ca.imp)?" ("+placeOf(IMPIANTI,l.ca.imp)+")":"")+" · "+l.ca.op]);}
  if(l.tr){kv.push(["FIR",l.tr.fir]);kv.push(["Trasportatore",l.tr.trasp+" · "+l.tr.targa]);kv.push(["Peso in partenza",fmtT(l.tr.pp)+" t"]);}
  if(l.sc){kv.push(["Peso a destino",fmtT(l.sc.pd)+" t ("+scost(l)+")"]);kv.push(["4ª copia FIR",l.sc.q4?"ricevuta":"in attesa"]);}
  var notes=l.ev.filter(function(e){return e.n;}).map(function(e){return '<li><time>'+esc(fmtD(e.d))+'</time><span>'+esc(STATI[e.s].short)+': '+esc(e.n)+'</span></li>';}).join("");
  return '<section class="grid" style="gap:8px"><button class="btn ghost" data-go="cumuli" style="justify-self:start">← Tutti i cumuli</button>'+
    '<div class="eyebrow">Lotto di produzione</div><h1 class="code" style="font-family:var(--f-mono);font-size:clamp(26px,5vw,40px)">'+esc(l.code)+'</h1>'+
    '<div class="actions">'+chipSt(s)+(isHaz(l)?'<span class="chip haz">pericoloso</span>':'')+'<span class="muted">'+esc(f.n)+' · '+esc(AREE[l.area])+'</span></div></section>'+
    '<section class="card">'+steps+'</section>'+
    '<section class="detail"><div class="grid" style="gap:18px"><div class="card"><h2 style="margin-bottom:10px">Dati del lotto</h2><dl class="kv">'+kv.map(function(r){return '<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd>';}).join("")+'</dl></div>'+
    (notes?'<div class="card"><h2 style="margin-bottom:6px">Note</h2><ul class="feed">'+notes+'</ul></div>':'')+
    (canEdit? formNext(l,s) : (s<5?'<p class="notice">Il prossimo passaggio, «'+esc(STATI[s+1].n.toLowerCase())+'», viene registrato dall\'addetto di cantiere.</p>':''))+
    '</div><aside class="card qrbox"><div class="eyebrow">Etichetta QR</div><div class="qr" id="qrHere" aria-label="QR code del lotto"></div><span class="code">'+esc(l.code)+'</span>'+
    '<span class="muted" style="font-size:12.5px">'+'Inquadrato con la fotocamera del telefono apre questa scheda.'+'</span>'+
    (canEdit?'<button class="btn ghost" data-act="label" data-code="'+esc(l.code)+'">Scarica etichetta</button>':'')+'</aside></section>';
}
function scost(l){if(!(l.sc&&l.tr))return "";var d=(l.sc.pd-l.tr.pp)/l.tr.pp*100;return (d>0?"+":"")+d.toLocaleString("it-IT",{maximumFractionDigits:1})+"% sul peso in partenza";}

function formNext(l,s){
  if(s>=5) return '<div class="notice">Lotto chiuso: scaricato all\'impianto'+(l.sc&&!l.sc.q4?'. Manca la 4ª copia del FIR. <button class="btn ghost" data-act="q4" data-code="'+esc(l.code)+'" style="margin-left:6px">Registra 4ª copia</button>':' e 4ª copia del FIR ricevuta.')+'</div>';
  var n=s+1, f=FR[l.fr], t=today(), h='';
  if(n===2) h=field("d","Data del prelievo","date",t)+field("verbale","N. verbale di prelievo","text","")+field("note","Note (incrementi, quartatura, foto)","text","","full");
  if(n===3) h=field("d","Data dell'esito","date",t)+field("rdp","Rapporto di prova","text","")+selList("lab","Laboratorio",LABS,(l.ca&&l.ca.lab)||"")+field("eer","Codice EER","text",f.eer)+
    '<label class="f" for="fhaz">Classificazione<select id="fhaz" name="haz"><option value="0">non pericoloso</option><option value="1"'+(l.fr==="AM"?" selected":"")+'>pericoloso</option></select></label>'+
    selList("imp","Impianto di riferimento",IMPIANTI,"")+'<label class="f" for="fop">Operazione<select id="fop" name="op">'+["R3","R4","R5","R12","R13","D1","D15"].map(function(o){return '<option'+(o===f.op?" selected":"")+'>'+o+'</option>';}).join("")+'</select></label>';
  if(n===4) h=field("d","Data del carico","date",t)+field("fir","N. FIR","text","")+field("trasp","Trasportatore","text","")+field("targa","Targa","text","")+field("pp","Peso in partenza (t)","number","");
  if(n===5) h=field("d","Data dello scarico","date",t)+field("pd","Peso a destino (t)","number","")+'<label class="f" for="fq4" style="align-self:end;display:flex;gap:8px;align-items:center"><input type="checkbox" id="fq4" name="q4"> 4ª copia del FIR ricevuta</label>';
  return '<form class="card grid" style="gap:12px" data-form="step" data-code="'+esc(l.code)+'" data-next="'+n+'"><h2>Registra: '+esc(STATI[n].n.toLowerCase())+'</h2><div class="form">'+h+'</div>'+
    '<div class="actions"><button class="btn" type="submit">Salva</button><span class="muted" style="font-size:13px">Il sito si aggiorna per tutti appena salvi.</span></div></form>';
}
function field(name,label,type,val,cls){var id="f"+name;return '<label class="f'+(cls?" "+cls:"")+'" for="'+id+'">'+esc(label)+'<input id="'+id+'" name="'+name+'" type="'+type+'"'+(type==="number"?' step="0.1" min="0"':'')+' value="'+esc(val)+'" required></label>';}

   '<section class="card tablewrap"><table><thead><tr><th>FIR</th><th>Lotto</th><th>EER</th><th>Carico</th><th>Trasportatore</th><th>Impianto</th><th>Op.</th><th class="num">Partenza t</th><th class="num">Destino t</th><th>Stato</th></tr></thead><tbody>'+
   (rows.length?rows.map(function(l){var s=stato(l);var st=s===4?'<span class="chip st4">in viaggio</span>':(l.sc.q4?'<span class="chip st5">chiuso</span>':'<span class="chip st2">attesa 4ª copia</span>');
     return '<tr class="click" data-lot="'+esc(l.code)+'"><td class="code">'+esc(l.tr.fir)+'</td><td class="code">'+esc(l.code)+'</td><td>'+esc(l.ca.eer)+'</td><td>'+esc(fmtD(evDate(l,4)))+'</td><td>'+esc(l.tr.trasp)+'</td><td>'+esc(l.ca.imp)+'</td><td>'+esc(l.ca.op)+'</td><td class="num">'+fmtT(l.tr.pp)+'</td><td class="num">'+(l.sc?fmtT(l.sc.pd):'–')+'</td><td>'+st+'</td></tr>';}).join(""):'<tr><td colspan="10" class="muted">Nessun FIR emesso.</td></tr>')+
   '</tbody><tfoot><tr><td colspan="7" style="font-weight:700">Totale</td><td class="num" style="font-weight:700">'+fmtT(tp)+'</td><td class="num" style="font-weight:700">'+fmtT(td)+'</td><td></td></tr></tfoot></table></section>';
}

function vAccesso(){if(canEdit)return '<section class="grid" style="gap:10px"><div class="eyebrow">Addetti di cantiere</div><h1>Accesso addetti</h1><p class="lead" style="margin:0">Sei collegato come addetto di cantiere su questo dispositivo.</p></section><div class="card grid" style="gap:12px;max-width:420px"><div class="actions"><button class="btn" data-go="nuovo">Vai a Gestione</button><button class="btn ghost" data-act="logout">Esci</button></div></div>';
  return '<section class="grid" style="gap:10px"><div class="eyebrow">Addetti di cantiere</div><h1>Accesso addetti</h1><p class="lead" style="margin:0">Inserisci il codice di accesso per registrare cumuli, prelievi, analisi, carichi e scarichi.</p></section>'+
  '<form class="card grid" style="gap:12px;max-width:420px" data-form="login"><label class="f" for="fpin">Codice di accesso<input id="fpin" name="pin" type="text" value="Scampia2026" autocomplete="off" required></label><p class="muted" style="margin:0;font-size:13px">Versione dimostrativa: il codice è già inserito, premi Accedi.</p><div class="actions"><button class="btn" type="submit">Accedi</button></div><p id="loginMsg" class="muted" style="margin:0" aria-live="polite"></p></form>';}

/* ---------- shell ---------- */
function render(){
  var app=document.getElementById("app");
  var nav=[["home","Lavori in corso"],["cumuli","Cumuli"],["fir","Registro FIR"]];nav.push(["nuovo","Gestione"]);nav.push(["accesso","Accesso addetti"]);
  var cur=CODE_RE.test(route)?"cumuli":route;
  var body= !loaded?'<section class="card"><p style="margin:0">'+(loadError?esc(loadError):'Caricamento dei dati del cantiere…')+'</p></section>': route==="home"?vHome(): route==="cumuli"?vCumuli(): route==="fir"?vFir(): route==="nuovo"?vNuovo(): route==="accesso"?vAccesso(): CODE_RE.test(route)?vLot(route): vHome();
  app.innerHTML='<header class="top"><div class="wrap"><div class="brandmark"><b>Cantiere Scampia</b><span>tracciabilità dei rifiuti</span></div>'+rti()+'<nav class="menu" aria-label="Menu">'+
    nav.map(function(n){return '<button data-go="'+n[0]+'"'+(cur===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>';}).join("")+'</nav></div></header>'+
    (state.demo?'<div class="demo"><div class="wrap"><b>Dati dimostrativi.</b><span>I lotti e i FIR mostrati sono esempi per illustrare il funzionamento, non dati reali di cantiere.</span></div></div>':'')+
    '<main class="wrap">'+body+'</main><footer class="wrap">RTI GEOS · Hexa Green · GF Service — codici EER secondo l\'elenco europeo dei rifiuti. '+(state.aggiornato?'Aggiornato il '+esc(fmtD(state.aggiornato.slice(0,10)))+'.':'')+'</footer>';
  if(CODE_RE.test(route)) drawQR(route);
  if(route==="nuovo"&&canEdit) updCode();
}
function rti(){return '<div class="rti" aria-label="Raggruppamento temporaneo di imprese"><figure class="m"><img src="'+LOGOS.geos+'" alt="GEOS"><figcaption>MANDATARIA</figcaption></figure><figure><img src="'+LOGOS.hexa+'" alt="Hexa Green"><figcaption>MANDANTE</figcaption></figure><figure><img src="'+LOGOS.gf+'" alt="GF Service"><figcaption>MANDANTE</figcaption></figure></div>';}
function go(r){if(r!=="nuovo")stopScan();route=r;try{if(location.hash!=="#"+r)history.replaceState(null,"","#"+r);}catch(e){}render();window.scrollTo(0,0);}
function drawQR(code){var el=document.getElementById("qrHere");if(!el)return;if(typeof QRCode==="undefined"){el.textContent="QR non disponibile";return;}
  el.innerHTML="";new QRCode(el,{text:qrText(code),width:360,height:360,colorDark:"#0b1a2a",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});}
function nextCumulo(area){var mx=0;state.lotti.forEach(function(l){if(l.area===area)mx=Math.max(mx,l.cumulo);});return mx+1;}
function makeCode(area,fr,d){var p=d.split("-");return "A"+area+"-C"+String(nextCumulo(area)).padStart(2,"0")+"-"+fr+"-"+p[2]+p[1];}
function updCode(){var f=document.querySelector('[data-form="nuovo"]');if(!f)return;var a=+f.area.value,fr=f.fr.value,d=f.d.value||today();var el=document.querySelector("#nCode .code");if(el)el.textContent=makeCode(a,fr,d);}
function toast(msg){document.querySelectorAll(".toast").forEach(function(x){x.remove();});var t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},3500);}

/* ---------- dati: lettura e salvataggio tramite le funzioni /api ---------- */
function nowIso(){var t=new Date();return today()+"T"+String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+":00";}
async function load(quiet){
  try{var r=await fetch("/api/state",{cache:"no-store"});if(!r.ok)throw new Error("http "+r.status);var j=await r.json();
    var changed=j.rev!==rev; state=j.data; rev=j.rev; loaded=true; loadError="";
    if(changed||!quiet){if(!(quiet&&isTyping()))render();}
  }catch(e){if(!loaded){loadError="Impossibile caricare i dati del cantiere. Controlla la connessione e ricarica la pagina.";render();}}
}
function isTyping(){var a=document.activeElement;return a&&(a.tagName==="INPUT"||a.tagName==="SELECT")&&a.closest("form");}
function lockBtns(on){document.querySelectorAll(".btn,button[type=submit]").forEach(function(b){b.disabled=on;});}
async function save(mut,msg,after){
  if(busy)return; if(!canEdit){toast("Per salvare serve l'accesso addetti");go("accesso");return;}
  busy=true; lockBtns(true);
  var s=JSON.parse(JSON.stringify(state)); mut(s); s.aggiornato=nowIso();
  try{
    var r=await fetch("/api/state",{method:"POST",headers:{"content-type":"application/json","x-pin":PIN},body:JSON.stringify({rev:rev,data:s})});
    var j=await r.json().catch(function(){return {};});
    if(r.status===409){state=j.data;rev=j.rev;toast("Un altro addetto ha appena aggiornato i dati: controlla e ripeti l'operazione.");render();}
    else if(r.status===401){PIN="";canEdit=false;try{localStorage.removeItem("scampia.pin");}catch(x){}toast("Codice di accesso non più valido: accedi di nuovo.");go("accesso");}
    else if(!r.ok){toast(j.error||"Salvataggio non riuscito. Riprova tra poco.");}
    else {state=j.data;rev=j.rev;toast(msg);go(after||route);}
  }catch(e){toast("Nessuna connessione: il dato non è stato salvato. Riprova.");}
  busy=false; lockBtns(false);
}
async function restoreDemo(){
  if(busy)return; busy=true; lockBtns(true);
  try{var r=await fetch("/api/reset",{method:"POST",headers:{"x-pin":PIN}});var j=await r.json().catch(function(){return {};});
    if(r.ok){state=j.data;rev=j.rev;toast("Dati dimostrativi ripristinati");go("home");}
    else if(r.status===401){PIN="";canEdit=false;try{localStorage.removeItem("scampia.pin");}catch(x){}toast("Codice di accesso non più valido: accedi di nuovo.");go("accesso");}
    else toast(j.error||"Ripristino non riuscito. Riprova tra poco.");
  }catch(e){toast("Nessuna connessione: riprova.");}
  busy=false; lockBtns(false);
}
async function login(pin){
  var m=document.getElementById("loginMsg");if(m)m.textContent="Verifica in corso…";
  try{var r=await fetch("/api/auth",{method:"POST",headers:{"x-pin":pin}});
    if(r.ok){PIN=pin;canEdit=true;try{localStorage.setItem("scampia.pin",pin);}catch(x){}toast("Accesso eseguito");go("nuovo");}
    else if(r.status===429){if(m)m.textContent="Troppi tentativi: attendi un minuto e riprova.";}
    else{if(m)m.textContent="Codice non corretto.";}
  }catch(e){if(m)m.textContent="Nessuna connessione. Riprova.";}
}
/* ---------- eventi ---------- */
document.addEventListener("click",function(e){
  var g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.getAttribute("data-go"));return;}
  var l=e.target.closest("[data-lot]");if(l){go(l.getAttribute("data-lot"));return;}
  var a=e.target.closest("[data-act]");if(!a)return;var act=a.getAttribute("data-act");
  if(act==="label")downloadLabel(a.getAttribute("data-code"));
  if(act==="q4"){var code=a.getAttribute("data-code");save(function(s){s.lotti.forEach(function(x){if(x.code===code)x.sc.q4=true;});},"4ª copia registrata per "+code,code);}
  if(act==="askclear"){document.getElementById("demoAct").innerHTML='<span>Elimino tutti i lotti e i FIR di esempio?</span><button class="btn warn" data-act="clear">Sì, elimina</button><button class="btn ghost" data-act="noclear">Annulla</button>';}
  if(act==="noclear"){render();}
  if(act==="askrestore"){document.getElementById("demoAct").innerHTML='<span>Riporto il sito ai dati dimostrativi iniziali? Le modifiche fatte finora verranno sostituite.</span><button class="btn" data-act="restore">Sì, ripristina</button><button class="btn ghost" data-act="noclear">Annulla</button>';}
  if(act==="restore"){restoreDemo();}
  if(act==="logout"){PIN="";canEdit=false;try{localStorage.removeItem("scampia.pin");}catch(x){}stopScan();go("home");}
  if(act==="scan"){startScan();}
  if(act==="stopscan"){stopScan();}
  if(act==="clear"){save(function(s){s.lotti=[];s.demo=false;},"Dati dimostrativi eliminati","home");}
});
document.addEventListener("input",function(e){var f=e.target.getAttribute&&e.target.getAttribute("data-filt");
  if(f){filt[f]=e.target.value;var pos=e.target.selectionStart;render();var el=document.querySelector('[data-filt="'+f+'"]');if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos);}catch(x){}}return;}
  if(e.target.closest('[data-form="nuovo"]'))updCode();});
document.addEventListener("change",function(e){if(e.target.id==="qrFile"&&e.target.files[0])readQR(e.target.files[0]);
  if(e.target.closest&&e.target.closest('[data-form="nuovo"]'))updCode();});
document.addEventListener("submit",function(e){var f=e.target;var kind=f.getAttribute("data-form");if(!kind)return;e.preventDefault();
  if(kind==="nuovo"){var area=+f.area.value,fr=f.fr.value,d=f.d.value,stima=parseFloat(f.stima.value);
    var code=makeCode(area,fr,d),cum=nextCumulo(area),note=f.note.value.trim();
    save(function(s){var ev={s:1,d:d};if(note)ev.n=note;s.lotti.push({code:code,area:area,cumulo:cum,fr:fr,stima:stima,ev:[ev]});},"Lotto "+code+" creato",code);}
  if(kind==="login"){login(f.pin.value.trim());}
  if(kind==="step"){var code2=f.getAttribute("data-code"),n=+f.getAttribute("data-next"),d2=f.d.value;
    save(function(s){var l=null;s.lotti.forEach(function(x){if(x.code===code2)l=x;});if(!l)return;var ev={s:n,d:d2};
      if(n===2){l.pr={verbale:f.verbale.value.trim()};ev.n="verbale "+l.pr.verbale+(f.note.value.trim()?", "+f.note.value.trim():"");}
      if(n===3){l.ca={rdp:f.rdp.value.trim(),lab:f.lab.value.trim(),eer:f.eer.value.trim(),haz:f.haz.value==="1",imp:f.imp.value.trim(),op:f.op.value};}
      if(n===4){l.tr={fir:f.fir.value.trim(),trasp:f.trasp.value.trim(),targa:f.targa.value.trim().toUpperCase(),pp:parseFloat(f.pp.value)};}
      if(n===5){l.sc={pd:parseFloat(f.pd.value),q4:f.q4.checked};}
      l.ev.push(ev);},STATI[n].n+" registrato per "+code2,code2);}
});
window.addEventListener("hashchange",function(){var h=location.hash.slice(1);if(h&&h!==route){route=h;render();}});

function readQR(file){var msg=document.getElementById("qrMsg");msg.textContent="Lettura in corso…";
  if(typeof jsQR==="undefined"){msg.textContent="Lettore QR non disponibile: inquadra il QR con la fotocamera del telefono.";return;}
  var img=new Image(),url=URL.createObjectURL(file);
  img.onload=function(){var max=1400,sc=Math.min(1,max/Math.max(img.width,img.height));var c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    var x=c.getContext("2d");x.drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    var r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height);
    if(!r){msg.textContent="Nessun QR riconosciuto. Avvicinati all'etichetta e riprova con più luce.";return;}
    gotCode(r.data);};
  img.onerror=function(){msg.textContent="Immagine non leggibile.";};img.src=url;}

function gotCode(text){var code=text.indexOf("#")>=0?text.split("#").pop():text;code=code.trim();
  if(CODE_RE.test(code)){stopScan();go(code);return true;}var m=document.getElementById("qrMsg");if(m)m.textContent="Il QR letto non contiene un codice lotto valido.";return false;}
async function startScan(){var v=document.getElementById("scanVid"),m=document.getElementById("qrMsg");if(!v)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){m.textContent="Fotocamera non disponibile: usa «Usa una foto».";return;}
  if(typeof jsQR==="undefined"){m.textContent="Lettore QR non disponibile.";return;}
  try{scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});}catch(e){m.textContent="Accesso alla fotocamera negato. Consentilo nelle impostazioni del browser o usa «Usa una foto».";return;}
  v.srcObject=scanStream;v.hidden=false;await v.play().catch(function(){});m.innerHTML='Inquadra il QR… <button class="btn ghost" data-act="stopscan" style="margin-left:8px">Ferma</button>';
  var c=document.createElement("canvas"),x=c.getContext("2d",{willReadFrequently:true});
  scanTimer=setInterval(function(){if(!v.videoWidth)return;var w=Math.min(800,v.videoWidth),h=Math.round(v.videoHeight*w/v.videoWidth);c.width=w;c.height=h;x.drawImage(v,0,0,w,h);
    var r=jsQR(x.getImageData(0,0,w,h).data,w,h);if(r&&r.data)gotCode(r.data);},250);}
function stopScan(){if(scanTimer){clearInterval(scanTimer);scanTimer=null;}if(scanStream){scanStream.getTracks().forEach(function(t){t.stop();});scanStream=null;}var v=document.getElementById("scanVid");if(v){v.hidden=true;v.srcObject=null;}}
async function downloadLabel(code){
  var l=lotByCode(code);if(!l)return;if(typeof QRCode==="undefined"){toast("Generatore QR non disponibile.");return;}
  var holder=document.createElement("div");new QRCode(holder,{text:qrText(code),width:420,height:420,correctLevel:QRCode.CorrectLevel.M});
  var q=holder.querySelector("canvas");var c=document.createElement("canvas");c.width=1200;c.height=600;var x=c.getContext("2d");
  x.fillStyle="#ffffff";x.fillRect(0,0,1200,600);x.fillStyle="#00589f";x.fillRect(0,0,1200,84);
  x.fillStyle="#ffffff";x.font="700 40px 'Barlow Condensed',Arial";x.fillText("CANTIERE SCAMPIA · LOTTO DI PRODUZIONE",40,56);
  x.drawImage(q,40,130,420,420);x.fillStyle="#0b1a2a";x.font="700 64px 'JetBrains Mono',monospace";x.fillText(code,500,200);
  x.font="600 34px 'Source Sans 3',Arial";x.fillText(AREE[l.area]+" · cumulo "+String(l.cumulo).padStart(2,"0"),500,270);x.fillText(FR[l.fr].n,500,320);
  x.fillText("Formato il "+fmtD(evDate(l,1)),500,370);x.fillStyle="#5a6878";x.fillText(l.ca?"EER "+l.ca.eer:"EER dopo l'esito analitico",500,440);
  c.toBlob(function(b){var u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="etichetta-"+code+".png";document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);},"image/png");}

/* ---------- avvio ---------- */
(function boot(){
  var h=decodeURIComponent(location.hash.slice(1));if(h&&(CODE_RE.test(h)||["home","cumuli","fir","nuovo","accesso"].indexOf(h)>=0))route=h;
  try{var p=localStorage.getItem("scampia.pin");if(p){PIN=p;canEdit=true;}}catch(e){}
  render(); load(false);
  setInterval(function(){if(!document.hidden&&!busy)load(true);},60000);
  document.addEventListener("visibilitychange",function(){if(!document.hidden&&!busy)load(true);});
})();
})();
</script>
</body>
</html>
